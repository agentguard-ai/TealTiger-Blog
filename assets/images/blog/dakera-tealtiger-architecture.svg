<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="tealG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dakeraG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="agentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="ds" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrTeal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/>
    </marker>
    <marker id="arrPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">TealTiger × Dakera: Persistent Governance State</text>
  <text x="400" y="55" text-anchor="middle" font-size="11" fill="#64748b">Storage = evidence/continuity, NOT authority</text>

  <!-- Agent Process(es) -->
  <g filter="url(#ds)">
    <rect x="50" y="80" width="200" height="80" rx="10" fill="url(#agentG)"/>
    <text x="150" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">AI Agent Process</text>
    <text x="150" y="130" text-anchor="middle" font-size="9" fill="#fffbeb">LLM calls, tool use, workflows</text>
    <text x="150" y="146" text-anchor="middle" font-size="9" fill="#fffbeb">May restart, scale, migrate</text>
  </g>

  <!-- TealTiger Middleware -->
  <g filter="url(#ds)">
    <rect x="300" y="80" width="220" height="80" rx="10" fill="url(#tealG)"/>
    <text x="410" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">TealTiger Governance</text>
    <text x="410" y="128" text-anchor="middle" font-size="9" fill="#ccfbf1">Deterministic policy eval &lt;5ms</text>
    <text x="410" y="144" text-anchor="middle" font-size="9" fill="#ccfbf1">Cost tracking • Decisions • Delegation</text>
  </g>

  <!-- Arrow Agent → TealTiger -->
  <path d="M250 120 L295 120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Dakera Backend -->
  <g filter="url(#ds)">
    <rect x="570" y="80" width="190" height="80" rx="10" fill="url(#dakeraG)"/>
    <text x="665" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Dakera Server</text>
    <text x="665" y="128" text-anchor="middle" font-size="9" fill="#ede9fe">Agent-scoped state persistence</text>
    <text x="665" y="144" text-anchor="middle" font-size="9" fill="#ede9fe">Knowledge graph • Decay retention</text>
  </g>

  <!-- Arrow TealTiger → Dakera -->
  <path d="M520 120 L565 120" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrPurple)"/>

  <!-- Three Adapter Boxes -->
  <!-- DakeraCostStorage -->
  <g filter="url(#ds)">
    <rect x="80" y="210" width="200" height="90" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <rect x="80" y="210" width="200" height="30" rx="10" fill="#0d9488"/>
    <text x="180" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">DakeraCostStorage</text>
    <text x="100" y="256" font-size="9" fill="#374151">• Implements CostStorage ABC</text>
    <text x="100" y="272" font-size="9" fill="#374151">• Per-agent cost records</text>
    <text x="100" y="288" font-size="9" fill="#374151">• Budget survives restarts</text>
  </g>

  <!-- DakeraDecisionStore -->
  <g filter="url(#ds)">
    <rect x="300" y="210" width="200" height="90" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <rect x="300" y="210" width="200" height="30" rx="10" fill="#0d9488"/>
    <text x="400" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">DakeraDecisionStore</text>
    <text x="320" y="256" font-size="9" fill="#374151">• Importance-tiered retention</text>
    <text x="320" y="272" font-size="9" fill="#374151">• DENY=0.95, ALLOW=0.80</text>
    <text x="320" y="288" font-size="9" fill="#374151">• Critical denials outlive approvals</text>
  </g>

  <!-- DakeraDelegationHelper -->
  <g filter="url(#ds)">
    <rect x="520" y="210" width="220" height="90" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <rect x="520" y="210" width="220" height="30" rx="10" fill="#0d9488"/>
    <text x="630" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">DakeraDelegationHelper</text>
    <text x="540" y="256" font-size="9" fill="#374151">• Knowledge graph edges</text>
    <text x="540" y="272" font-size="9" fill="#374151">• delegated_from relationships</text>
    <text x="540" y="288" font-size="9" fill="#374151">• Full audit-trail traversal</text>
  </g>

  <!-- Connecting lines from TealTiger to adapters -->
  <path d="M410 160 L180 205" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrTeal)"/>
  <path d="M410 160 L400 205" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrTeal)"/>
  <path d="M410 160 L630 205" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrTeal)"/>

  <!-- Key Principle Box -->
  <rect x="100" y="330" width="600" height="70" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="400" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Design Principle</text>
  <text x="400" y="375" text-anchor="middle" font-size="10" fill="#6b21a8">A stored ALLOW from yesterday cannot authorize today's action.</text>
  <text x="400" y="393" text-anchor="middle" font-size="10" fill="#6b21a8">Every new request gets a fresh deterministic evaluation. Storage informs; it doesn't permit.</text>
</svg>
