<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="daytonaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Defense-in-Depth: TealTiger + Daytona Architecture</text>

  <!-- LLM Box -->
  <rect x="300" y="60" width="200" height="60" rx="10" fill="url(#llmGrad)" filter="url(#shadow)"/>
  <text x="400" y="87" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">LLM Provider</text>
  <text x="400" y="105" text-anchor="middle" font-size="10" fill="#fffbeb">Generates code / tool calls</text>

  <!-- Arrow down -->
  <path d="M400 120 L400 155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- TealTiger Pre-Execution -->
  <rect x="220" y="160" width="360" height="100" rx="12" fill="url(#tealGrad)" filter="url(#shadow)"/>
  <text x="400" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">TealTiger — Pre-Execution Governance</text>
  <text x="400" y="210" text-anchor="middle" font-size="10" fill="#ccfbf1">Logic layer: decides IF code should execute</text>

  <!-- TealTiger features -->
  <rect x="240" y="220" width="100" height="28" rx="6" fill="#0f766e"/>
  <text x="290" y="238" text-anchor="middle" font-size="9" fill="#fff">Secret Scan</text>
  <rect x="350" y="220" width="80" height="28" rx="6" fill="#0f766e"/>
  <text x="390" y="238" text-anchor="middle" font-size="9" fill="#fff">PII Check</text>
  <rect x="440" y="220" width="120" height="28" rx="6" fill="#0f766e"/>
  <text x="500" y="238" text-anchor="middle" font-size="9" fill="#fff">Budget Enforce</text>

  <!-- Arrow down (approved) -->
  <path d="M400 260 L400 295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="360" y="268" width="80" height="18" rx="4" fill="#dcfce7"/>
  <text x="400" y="280" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">✓ Approved</text>

  <!-- Daytona Sandbox -->
  <rect x="220" y="300" width="360" height="90" rx="12" fill="url(#daytonaGrad)" filter="url(#shadow)"/>
  <text x="400" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Daytona — Isolated Sandbox</text>
  <text x="400" y="348" text-anchor="middle" font-size="10" fill="#e0e7ff">Infrastructure layer: decides WHERE and HOW</text>

  <!-- Daytona features -->
  <rect x="240" y="358" width="90" height="22" rx="6" fill="#4338ca"/>
  <text x="285" y="373" text-anchor="middle" font-size="9" fill="#fff">Kernel</text>
  <rect x="340" y="358" width="100" height="22" rx="6" fill="#4338ca"/>
  <text x="390" y="373" text-anchor="middle" font-size="9" fill="#fff">Filesystem</text>
  <rect x="450" y="358" width="110" height="22" rx="6" fill="#4338ca"/>
  <text x="505" y="373" text-anchor="middle" font-size="9" fill="#fff">Network Stack</text>

  <!-- Arrow down (result) -->
  <path d="M400 390 L400 425" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- TealTiger Post-Execution -->
  <rect x="220" y="430" width="360" height="70" rx="12" fill="url(#tealGrad)" filter="url(#shadow)" opacity="0.85"/>
  <text x="400" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">TealTiger — Post-Execution Audit</text>
  <text x="400" y="480" text-anchor="middle" font-size="10" fill="#ccfbf1">TEEC receipt • Cost attribution • Output scan</text>

  <!-- Side labels -->
  <rect x="30" y="160" width="140" height="40" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="100" y="178" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">LOGIC GOVERNANCE</text>
  <text x="100" y="192" text-anchor="middle" font-size="8" fill="#5eead4">&lt;5ms deterministic</text>

  <rect x="30" y="310" width="140" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="100" y="328" text-anchor="middle" font-size="9" font-weight="600" fill="#6366f1">INFRA ISOLATION</text>
  <text x="100" y="342" text-anchor="middle" font-size="8" fill="#a5b4fc">Dedicated environment</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
